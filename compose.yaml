name: handoffguard

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: handoffguard
      POSTGRES_DB: handoffguard
      POSTGRES_PASSWORD: ${HG_POSTGRES_PASSWORD:?Run ./compose.sh up to create credentials}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U handoffguard -d handoffguard']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: api
    environment:
      HANDOFFGUARD_DATABASE_URL: postgresql://handoffguard:${HG_POSTGRES_PASSWORD:?Missing database password}@db:5432/handoffguard?sslmode=disable
      HANDOFFGUARD_API_TOKEN: ${HG_API_TOKEN:?Missing API token}
    volumes:
      - signing-keys:/data
    depends_on:
      db:
        condition: service_healthy
    # Dashboard and demo share this network namespace; API remains loopback-only.
    ports:
      - '127.0.0.1:${HG_DASHBOARD_PORT:-3100}:3000'
    healthcheck:
      test: [CMD, wget, -q, --spider, 'http://127.0.0.1:8080/healthz']
      interval: 3s
      timeout: 3s
      retries: 20
    init: true
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    network_mode: service:api
    environment:
      HANDOFFGUARD_SERVER_URL: http://127.0.0.1:8080
      HANDOFFGUARD_API_TOKEN: ${HG_API_TOKEN:?Missing API token}
      HANDOFFGUARD_DASHBOARD_PASSWORD: ${HG_DASHBOARD_PASSWORD:?Missing viewer password}
      HANDOFFGUARD_DASHBOARD_SECRET: ${HG_DASHBOARD_SECRET:?Missing session secret}
    depends_on:
      api:
        condition: service_healthy
        restart: true
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:3000/login").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 3s
      timeout: 3s
      retries: 20
    init: true
    restart: unless-stopped

  demo:
    profiles: [demo]
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: demo
    network_mode: service:api
    environment:
      HANDOFFGUARD_SERVER_URL: http://127.0.0.1:8080
      HANDOFFGUARD_API_TOKEN: ${HG_API_TOKEN:?Missing API token}
    depends_on:
      api:
        condition: service_healthy
    init: true
    restart: 'no'

volumes:
  postgres-data:
  signing-keys:
