[project]
name = "handoffguard-agents"
version = "0.1.0"
description = "OpenAI Agents SDK integration for HandoffGuard"
requires-python = ">=3.11"
dependencies = ["openai-agents", "httpx"]

[tool.uv]
# Newer cryptography releases lack a wheel for the development Intel Mac.
constraint-dependencies = ["cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'"]
